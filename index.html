<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#244b3d">
  <meta name="description" content="用精美的立体麻将牌，探索分类、组合、推理与数学中的小秘密。">
  <title>麻将数学工坊 · 把数学摆在桌上</title>
  <script>
    if (location.protocol !== 'file:') {
      const icon = document.createElement('link');
      icon.rel = 'icon'; icon.type = 'image/svg+xml'; icon.href = '/public/icon.svg';
      const stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet'; stylesheet.href = '/src/styles.css';
      const workshopStylesheet = document.createElement('link');
      workshopStylesheet.rel = 'stylesheet'; workshopStylesheet.href = '/src/workshop.css';
      document.head.append(icon, stylesheet, workshopStylesheet);
    }
  </script>
  <script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head>
<body class="workshop-app">
  <div id="app"><div class="boot"><span class="brand-mark">三</span><p>正在铺好我们的数学桌……</p></div></div>
  <button id="workshop-immersive-exit" class="workshop-immersive-exit" hidden aria-label="退出沉浸模式">↙ 返回菜单 <kbd>Esc</kbd></button>
  <canvas id="tile-canvas" aria-hidden="true"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <input id="import-file" type="file" accept="application/json" hidden>
  <script>
    if (location.protocol === 'file:') {
      const style = document.createElement('style');
      style.textContent = `
        *{box-sizing:border-box}body{margin:0;background:#f5f4ed;color:#293d32;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}
        #tile-canvas{display:none}.local-start{max-width:720px;margin:8vh auto;padding:40px;background:#fffefa;border:1px solid #e1e4d8;border-radius:24px;box-shadow:0 18px 64px #244b3d0a}
        .local-brand{display:flex;align-items:center;gap:12px;color:#52694e;font-size:15px;letter-spacing:.08em}.local-mark{display:inline-grid;place-items:center;width:42px;height:52px;border-radius:9px;background:#244b3d;color:#f8f3de;font-size:27px}
        .local-start h1{font-size:30px;line-height:1.4;margin:28px 0 16px}.local-start p{font-size:17px;margin:12px 0;color:#53604f}.local-start ol{padding-left:26px;margin:24px 0;font-size:17px}.local-start li{padding:7px 0 7px 5px}
        .local-start strong{color:#244b3d}.local-file{display:inline-block;padding:2px 10px;border-radius:7px;background:#eef1e5;overflow-wrap:anywhere}.local-enter{display:inline-block;margin-top:10px;padding:12px 20px;border-radius:10px;background:#244b3d;color:#fffefa;text-decoration:none;font-size:17px;font-weight:600}.local-enter:hover{background:#32634f}.local-enter:focus-visible{outline:3px solid #b48b43;outline-offset:4px}.local-start .local-tip{font-size:14px;margin-top:18px;color:#75816d}
        @media(max-width:600px){.local-start{margin:22px 14px;padding:26px 22px;border-radius:18px}.local-start h1{font-size:25px}.local-start p,.local-start ol{font-size:16px}.local-enter{font-size:16px}}
      `;
      document.head.append(style);
      document.querySelector('#app').innerHTML = `
        <main class="local-start">
          <div class="local-brand"><span class="local-mark" aria-hidden="true">三</span><span>麻将数学工坊</span></div>
          <h1>从启动文件进入数学工坊</h1>
          <p>桌子和麻将牌都已准备好。请先打开同一文件夹中的启动程序，工坊就能正常运行。</p>
          <ol>
            <li>回到 <strong>MaJiang</strong> 项目文件夹。</li>
            <li>双击 <strong class="local-file">启动数学工坊.command</strong>。</li>
            <li>保留启动窗口，浏览器会自动打开游戏。</li>
          </ol>
          <a class="local-enter" href="http://localhost:8787">工坊已启动，点这里进入 →</a>
          <p class="local-tip">如果还没有运行启动程序，请先完成上面的步骤。结束游戏后，可在启动窗口按 Control+C。</p>
        </main>
      `;
    } else {
      import('/src/app.js').catch(error => {
        console.error('Workshop startup:', error);
        const app = document.querySelector('#app');
        app.innerHTML = '<div class="boot"><span class="brand-mark">三</span><p>工坊没有顺利打开，请刷新后再试。</p><small style="color:#8a927f"></small></div>';
        app.querySelector('small').textContent = String(error.message);
      });
    }
  </script>
</body>
</html>
